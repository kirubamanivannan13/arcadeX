# Spring Boot Application Properties for Arcade Smart Xerox
spring.application.name=arcade-xerox-backend
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/arcade_xerox?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Multipart limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# JWT Configuration
arcade.jwt.secret=9a67c7e69bcdc978cd95d4855e9973551e40685f6f616fdd542615a383622596
arcade.jwt.expiration-ms=86400000

# Xerox Pricing Defaults (in INR)
arcade.pricing.bw-per-page=2.00
arcade.pricing.color-per-page=5.00
arcade.pricing.staple-binding=5.00
arcade.pricing.spiral-binding=30.00
arcade.pricing.lamination-per-page=20.00
arcade.pricing.gst-percent=5.00
